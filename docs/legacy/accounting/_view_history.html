<!-- =========================================================================
     VIEW: _view_history — [Phase 4/#8 + Phase C] ประวัติสินค้า/ราคา
     ========================================================================= -->
<div id="view-history" class="hidden">
  <div class="bg-white rounded-2xl shadow-sm p-4 md:p-6">
    <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
      <h2 class="text-xl font-bold text-gray-800">ประวัติสินค้า / ราคา</h2>
      <div class="flex items-center gap-3">
        <label class="flex items-center gap-1.5 text-sm text-gray-600 cursor-pointer">
          <input type="checkbox" id="hist-pc" checked onchange="loadHistory()" class="w-4 h-4"> รวมเช็คราคา
        </label>
        <button onclick="loadHistory()" class="text-sm text-blue-600 border border-blue-200 rounded-lg px-3 py-1.5 hover:bg-blue-50">🔄 รีเฟรช</button>
      </div>
    </div>

    <!-- [Phase C] ฟิลเตอร์ หมวดหมู่ / งาน / คู่ค้า + ค้นชื่อสินค้า (ค้นเฉพาะในกลุ่มที่ฟิลเตอร์) -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-2 mb-3">
      <select id="hist-f-cat" onchange="renderHistory()" class="border-gray-300 rounded-lg border p-2 text-sm"><option value="">ทุกหมวดหมู่</option></select>
      <select id="hist-f-job" onchange="renderHistory()" class="border-gray-300 rounded-lg border p-2 text-sm"><option value="">ทุกงาน</option></select>
      <select id="hist-f-contact" onchange="renderHistory()" class="border-gray-300 rounded-lg border p-2 text-sm"><option value="">ทุกคู่ค้า</option></select>
      <input type="text" id="hist-filter" placeholder="ค้นชื่อสินค้า..." oninput="renderHistory()" class="border-gray-300 rounded-lg border p-2 text-sm">
    </div>

    <div id="hist-sum" class="mb-2 text-sm font-semibold text-blue-700"></div>
    <div id="hist-loading" class="text-center text-gray-400 py-8 hidden">กำลังโหลด...</div>

    <div class="overflow-x-auto">
      <table class="w-full text-sm">
        <thead><tr class="text-left text-gray-500 border-b">
          <th class="py-2 px-2"><input type="checkbox" id="hist-all" onchange="toggleAllHist(this)"></th>
          <th class="py-2 px-2">วันที่</th>
          <th class="py-2 px-2">สินค้า</th>
          <th class="py-2 px-2">หมวดหมู่</th>
          <th class="py-2 px-2">งาน</th>
          <th class="py-2 px-2 text-right">จำนวน</th>
          <th class="py-2 px-2 text-right">ราคา/หน่วย</th>
          <th class="py-2 px-2 text-right">รวม</th>
          <th class="py-2 px-2">คู่ค้า</th>
          <th class="py-2 px-2">ประเภท</th>
        </tr></thead>
        <tbody id="hist-body"></tbody>
      </table>
    </div>
  </div>
</div>
