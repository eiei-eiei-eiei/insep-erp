        /**
         * ปรับเทียบดีกรีที่อ่าน + อุณหภูมิ → ดีกรีจริงที่ 20°C
         * ใช้ตาราง calal + bilinear interpolation (วิธีเดียวกับเว็บแอป calal เป๊ะ)
         * คืน null ถ้านอกช่วง (อุณหภูมิ 0-40, แอลกอฮอล์ 0-100) หรือจุดข้อมูลว่างในตาราง
         */
        function correctAbvTo20C(abvObs, tempC) {
            const measuredAlc = parseFloat(abvObs), temp = parseFloat(tempC);
            if (isNaN(measuredAlc) || isNaN(temp)) return null;
            const alcHeaders = ABV_CORR_TABLE[0].slice(1).map(Number);
            const tempData = ABV_CORR_TABLE.slice(1);
            const minTemp = tempData[0][0], maxTemp = tempData[tempData.length - 1][0];
            const minAlc = alcHeaders[0], maxAlc = alcHeaders[alcHeaders.length - 1];
            if (temp < minTemp || temp > maxTemp || measuredAlc < minAlc || measuredAlc > maxAlc) return null;
            let t1 = tempData.findIndex(row => row[0] >= temp);
            if (tempData[t1][0] > temp) t1--;
            let t2 = (t1 === tempData.length - 1) ? t1 : t1 + 1;
            let a1 = alcHeaders.findIndex(val => val >= measuredAlc);
            if (alcHeaders[a1] > measuredAlc) a1--;
            let a2 = (a1 === alcHeaders.length - 1) ? a1 : a1 + 1;
            const temp1 = tempData[t1][0], temp2 = tempData[t2][0];
            const alc1 = alcHeaders[a1], alc2 = alcHeaders[a2];
            const Q11 = parseFloat(tempData[t1][a1 + 1]), Q12 = parseFloat(tempData[t1][a2 + 1]);
            const Q21 = parseFloat(tempData[t2][a1 + 1]), Q22 = parseFloat(tempData[t2][a2 + 1]);
            if (isNaN(Q11) || isNaN(Q12) || isNaN(Q21) || isNaN(Q22)) return null;
            const alcR = (alc2 - alc1) === 0 ? 0 : (measuredAlc - alc1) / (alc2 - alc1);
            const tempR = (temp2 - temp1) === 0 ? 0 : (temp - temp1) / (temp2 - temp1);
            const R1 = Q11 + alcR * (Q12 - Q11);
            const R2 = Q21 + alcR * (Q22 - Q21);
            return Math.round((R1 + tempR * (R2 - R1)) * 100) / 100;
        }

        /** เติม dropdown Batch (ใช้ pendingBatches ร่วมหน้ากลั่น) */
        function updateDtBatchDropdown() {
            const sel = document.getElementById('dt-batch');
            if (!sel) return;
            const prev = sel.value;
            let o = '<option value="">-- เลือก Batch ที่จะกลั่น --</option>';
            globalPendingBatches.forEach(b => { o += `<option value="${b.batch}" data-product="${b.productName}" data-fermvol="${b.fermVol || 0}">Batch: ${b.batch} (${b.productName})</option>`; });
            if (globalPendingBatches.length === 0) o += '<option value="" disabled>ไม่มี Batch รอกลั่น</option>';
            sel.innerHTML = o;
            if (prev) sel.value = prev;
        }

        function onDtBatchChange() {
            const sel = document.getElementById('dt-batch');
            const opt = sel.options[sel.selectedIndex];
            dtBatch = sel.value;
            dtProduct = (opt && opt.dataset.product) ? opt.dataset.product : '';
            dtFermVol = (opt && opt.dataset.fermvol) ? parseFloat(opt.dataset.fermvol) : 0;
            document.getElementById('dt-product-name').value = dtProduct;
            dtStopTimer(); dtActiveRun = null;
            if (!dtBatch) { dtResetPanels(); return; }
            dtLoadData();
        }

        function dtLoadData() {
            dtViewPot = null;   // รีเซ็ตหม้อที่ดูทุกครั้งที่โหลดใหม่ (ให้ตามหม้อ active)
            google.script.run
                .withSuccessHandler(function(res) {
                    if (!res || res.success === false) { Swal.fire('Error', (res && res.message) || 'โหลดไม่สำเร็จ', 'error'); return; }
                    dtAllReadings = res.data || [];
                    dtRender();
                })
                .withFailureHandler(function(err) { Swal.fire('Error', err.message, 'error'); })
                .getDistillRunData(dtBatch);
        }

        /** จัดกลุ่ม readings ตามหม้อ (potNo) */
        function dtGroupPots() {
            const pots = {};
            dtAllReadings.forEach(r => {
                if (!pots[r.potNo]) pots[r.potNo] = { potNo: r.potNo, runId: r.runId, rows: [], hasStart: false, hasEnd: false };
                pots[r.potNo].rows.push(r);
                pots[r.potNo].runId = r.runId;
                if (r.phase === 'เริ่มกลั่น') pots[r.potNo].hasStart = true;
                if (r.phase === 'จบหม้อ') pots[r.potNo].hasEnd = true;
            });
            return pots;
        }

        /** รวมปริมาณน้ำหมักที่กลั่นไปแล้วทุกหม้อ (จาก marker เริ่มกลั่น) */
        function dtChargedTotal(pots) {
            let sum = 0;
            Object.values(pots).forEach(p => {
                const marker = p.rows.find(r => r.phase === 'เริ่มกลั่น');
                if (marker) { const v = parseFloat(marker.fermCharge); if (!isNaN(v)) sum += v; }
            });
            return sum;
        }

        /** รวมยอดหัวใจ (ช่วงกลาง) ต่อหม้อ + ทั้ง batch — เฉลี่ยดีกรีถ่วงน้ำหนักด้วยปริมาณ */
        function dtComputeBatchSummary(pots) {
            let totalVol = 0, totalWsum = 0;
            const potSummary = {};
            Object.values(pots).forEach(p => {
                // เก็บ หัว/กลาง/หาง แยกภาชนะ → "ปริมาณสะสม" รีเซ็ตต่อช่วง
                // หัวใจ = เฉพาะช่วงกลาง, prevCum เริ่ม 0 ที่ต้นช่วง (ยอดสุดท้ายของกลาง = ปริมาณหัวใจรวม)
                const heartsReads = p.rows.filter(r => r.phase === 'กลาง')
                                          .sort((a, b) => (parseFloat(a.minute) || 0) - (parseFloat(b.minute) || 0));
                let prevCum = 0, heartsVol = 0, wsum = 0;
                heartsReads.forEach(r => {
                    const cum = parseFloat(r.cumVol); if (isNaN(cum)) return;
                    let delta = cum - prevCum; if (delta < 0) delta = 0;   // ภายในช่วงเพิ่มขึ้นเสมอ
                    prevCum = cum;
                    const a = parseFloat(r.abv20);
                    heartsVol += delta;
                    if (!isNaN(a)) wsum += delta * a;
                });
                potSummary[p.potNo] = { vol: heartsVol, abv: heartsVol > 0 ? wsum / heartsVol : 0 };
                totalVol += heartsVol; totalWsum += wsum;
            });
            return { pots: potSummary, totalVol: totalVol, totalAbv: totalVol > 0 ? totalWsum / totalVol : 0 };
        }

        function dtRender() {
            const pots = dtGroupPots();
            const potList = Object.values(pots).sort((a, b) => a.potNo - b.potNo);
            const sum = dtComputeBatchSummary(pots);

            // สรุปหม้อ
            const charged = dtChargedTotal(pots);
            const openPot = potList.find(p => p.hasStart && !p.hasEnd);
            const headerLine = `<div class="flex flex-wrap justify-between gap-2 border-b border-gray-200 pb-1 mb-2 text-blue-800"><span>น้ำหมัก: ทั้งหมด <b>${dtFermVol.toFixed(1)}</b> ล.</span><span>กลั่นแล้ว ${charged.toFixed(1)} ล. · เหลือ <b>${(dtFermVol - charged).toFixed(1)}</b> ล.</span></div>`;

            const summaryEl = document.getElementById('dt-pot-summary');
            if (potList.length === 0) {
                summaryEl.innerHTML = headerLine + '<span class="text-gray-400 italic">ยังไม่มีหม้อกลั่นใน Batch นี้ — กด "เริ่มกลั่นหม้อใหม่"</span>';
            } else {
                let batchVol = 0, batchWsum = 0;
                const potHtml = potList.map(p => {
                    // หม้อที่จบแล้ว → ใช้ค่าวัดจริงจากแถวจบหม้อ, หม้อที่กำลังทำ → ค่าคำนวณ
                    const finRow = p.rows.find(r => r.phase === 'จบหม้อ');
                    let pvol, pabv, src;
                    if (finRow && parseFloat(finRow.cumVol) > 0) {
                        pvol = parseFloat(finRow.cumVol) || 0; pabv = parseFloat(finRow.abv20) || 0; src = '<span class="text-xs text-green-600">·วัด</span>';
                    } else {
                        const s = sum.pots[p.potNo] || { vol: 0, abv: 0 }; pvol = s.vol; pabv = s.abv; src = '<span class="text-xs text-gray-400">·คำนวณ</span>';
                    }
                    batchVol += pvol; batchWsum += pvol * pabv;
                    const status = p.hasEnd ? '<span class="text-green-600">✓ จบแล้ว</span>' : (p.hasStart ? '<span class="text-orange-600">⏳ กำลังกลั่น</span>' : '');
                    return `<div class="flex justify-between border-b border-gray-100 py-1"><span>หม้อ ${p.potNo} <span class="text-xs">${status}</span></span><span class="text-gray-600">หัวใจ ${pvol.toFixed(2)} ล. @ ${pabv.toFixed(1)}% ${src}</span></div>`;
                }).join('');
                summaryEl.innerHTML = headerLine + potHtml + `<div class="flex justify-between font-bold pt-2 text-green-700"><span>รวมหัวใจทั้ง Batch</span><span>${batchVol.toFixed(2)} ล. @ ${(batchVol > 0 ? batchWsum / batchVol : 0).toFixed(1)}%</span></div>`;
            }

            document.getElementById('dt-finishpot-panel').classList.add('hidden');
            const ctr = document.getElementById('dt-controls');
            if (openPot) {
                dtResumeActive(openPot);
                ctr.innerHTML = `<button type="button" onclick="dtFinishPot()" class="bg-slate-700 text-white px-4 py-2 rounded font-bold hover:bg-slate-800"><i class="fa-solid fa-stop mr-1"></i> จบหม้อนี้</button>`;
            } else {
                dtStopTimer(); dtActiveRun = null;
                document.getElementById('dt-reading-panel').classList.add('hidden');
                document.getElementById('dt-finish-panel').classList.add('hidden');
                let btns = `<button type="button" onclick="dtStartRun()" class="bg-orange-600 text-white px-4 py-2 rounded font-bold hover:bg-orange-700"><i class="fa-solid fa-play mr-1"></i> เริ่มกลั่นหม้อใหม่</button>`;
                if (dtComputeBatchFromFinish(pots).totalVol > 0) btns += `<button type="button" onclick="dtOpenFinish()" class="bg-green-600 text-white px-4 py-2 rounded font-bold hover:bg-green-700"><i class="fa-solid fa-flag-checkered mr-1"></i> ปิด Batch (กลั่นครบ)</button>`;
                ctr.innerHTML = btns;
            }

            const viewPot = dtViewPot || (openPot ? openPot.potNo : (potList.length ? potList[potList.length - 1].potNo : null));
            dtRenderDetail(viewPot, pots);
        }

        /** เลือกหม้อที่จะดูในกราฟ/ตาราง */
        function dtSelectPot(n) {
            dtViewPot = n;
            dtRenderDetail(n, dtGroupPots());
        }

        /** กลับมาทำหม้อที่ค้างอยู่ต่อ (resume timer + state จาก reading เดิม) */
        function dtResumeActive(pot) {
            const startRow = pot.rows.find(r => r.phase === 'เริ่มกลั่น');
            const startTs = (startRow && startRow.ts) ? startRow.ts : (pot.rows[0] && pot.rows[0].ts) || Date.now();
            dtActiveRun = { runId: pot.runId, potNo: pot.potNo, startTs: startTs };
            const reads = pot.rows.filter(r => DT_PHASES.indexOf(r.phase) >= 0)
                                  .sort((a, b) => (parseFloat(a.minute) || 0) - (parseFloat(b.minute) || 0));
            dtMaxPhase = 0; dtLastCum = 0; dtLastMin = 0; dtLastPhase = '';
            reads.forEach(r => {
                const idx = DT_PHASES.indexOf(r.phase) + 1; if (idx > dtMaxPhase) dtMaxPhase = idx;
                const c = parseFloat(r.cumVol); if (!isNaN(c)) dtLastCum = c;
                const m = parseFloat(r.minute); if (!isNaN(m)) dtLastMin = m;
                dtLastPhase = r.phase;
            });
            document.getElementById('dt-active-pot').innerText = 'หม้อ ' + pot.potNo;
            document.getElementById('dt-reading-panel').classList.remove('hidden');
            document.getElementById('dt-finish-panel').classList.add('hidden');
            dtRenderPhaseOptions();
            dtStartTimer();
            dtClearLap();   // เริ่ม/กลับมาทำหม้อ → เคลียร์เวลาที่ล็อคไว้
        }

        function dtStartRun() {
            if (!dtBatch) { Swal.fire('เลือก Batch ก่อน', '', 'warning'); return; }
            const pots = dtGroupPots();
            const potList = Object.values(pots);
            const nextPot = (potList.length ? Math.max.apply(null, potList.map(p => p.potNo)) : 0) + 1;
            const charged = dtChargedTotal(pots);
            const remaining = dtFermVol - charged;
            let info = `ปริมาณที่หมักทั้งหมด: <b>${dtFermVol.toFixed(1)} ล.</b>`;
            if (nextPot >= 2) info += `<br>กลั่นไปแล้ว: ${charged.toFixed(1)} ล. · เหลือ: <b>${remaining.toFixed(1)} ล.</b>`;
            Swal.fire({
                title: 'เริ่มกลั่นหม้อ ' + nextPot,
                html: info + '<br><br><span style="font-size:0.9rem">ปริมาณน้ำหมักที่เทลงหม้อนี้ (ลิตร)</span>',
                input: 'number',
                inputAttributes: { step: '0.1', min: '0' },
                showCancelButton: true,
                confirmButtonText: 'เริ่มกลั่น',
                cancelButtonText: 'ยกเลิก',
                inputValidator: v => (!v || parseFloat(v) <= 0) ? 'กรอกปริมาณน้ำหมัก' : null
            }).then(rc => {
                if (!rc.isConfirmed) return;
                const chargeVol = parseFloat(rc.value);
                Swal.fire({ title: 'กำลังเริ่มหม้อใหม่...', didOpen: () => Swal.showLoading(), allowOutsideClick: false });
                google.script.run
                    .withSuccessHandler(function(res) {
                        if (!res || res.success === false) { Swal.fire('Error', (res && res.message) || 'เริ่มไม่สำเร็จ', 'error'); return; }
                        Swal.close();
                        dtClearReadingInputs();
                        dtLoadData(); // จะ resume หม้อใหม่อัตโนมัติ (อ่าน marker กลับมา)
                    })
                    .withFailureHandler(function(err) { Swal.fire('Error', err.message, 'error'); })
                    .startDistillRun(dtBatch, dtProduct, chargeVol);
            });
        }

        /** dropdown ช่วง — เดินหน้าทางเดียว: โชว์เฉพาะช่วง ≥ ช่วงล่าสุดที่บันทึก */
        function dtRenderPhaseOptions() {
            const sel = document.getElementById('dt-phase');
            let o = '';
            DT_PHASES.forEach((ph, i) => { if ((i + 1) >= Math.max(dtMaxPhase, 1)) o += `<option value="${ph}">${ph}</option>`; });
            sel.innerHTML = o;
        }

        function dtComputeAbv20() {
            const v = correctAbvTo20C(document.getElementById('dt-abv-obs').value, document.getElementById('dt-temp-spirit').value);
            document.getElementById('dt-abv20-preview').innerText = (v === null) ? '—' : (v.toFixed(2) + '%');
        }

        function dtComputeFlow() {
            const cum = parseFloat(document.getElementById('dt-cum-vol').value);
            const phase = document.getElementById('dt-phase').value;
            const el = document.getElementById('dt-flow-preview');
            if (!dtActiveRun || isNaN(cum) || phase !== dtLastPhase) { el.innerText = ''; return; }   // flow คิดเฉพาะในช่วงเดียวกัน
            const refMs = (dtLapAtMs != null) ? dtLapAtMs : Date.now();   // ใช้เวลาที่ล็อค (Lap) ถ้ามี
            const min = (refMs - dtActiveRun.startTs) / 60000;
            const dMin = min - dtLastMin, dVol = cum - dtLastCum;
            el.innerText = (dMin > 0 && dVol >= 0) ? `≈ ${(dVol * 1000 / dMin).toFixed(0)} ml/min` : '';
        }

        function dtNum(id) { const v = document.getElementById(id).value; return v === '' ? '' : parseFloat(v); }

        function dtAddReading() {
            if (!dtActiveRun) { Swal.fire('ยังไม่ได้เริ่มกลั่น', '', 'warning'); return; }
            const phase = document.getElementById('dt-phase').value;
            if (phase === '') { Swal.fire('เลือกช่วงก่อน', '', 'warning'); return; }
            const abvObs = document.getElementById('dt-abv-obs').value;
            const tempSpirit = document.getElementById('dt-temp-spirit').value;
            const cumVol = parseFloat(document.getElementById('dt-cum-vol').value);
            const refMs = (dtLapAtMs != null) ? dtLapAtMs : Date.now();   // ใช้เวลาที่ล็อค (Lap) ถ้ามี
            const minute = Math.round((refMs - dtActiveRun.startTs) / 60000 * 10) / 10;
            const abv20 = correctAbvTo20C(abvObs, tempSpirit);
            let flow = '';
            if (!isNaN(cumVol) && phase === dtLastPhase) { const dMin = minute - dtLastMin, dVol = cumVol - dtLastCum; if (dMin > 0 && dVol >= 0) flow = Math.round(dVol * 1000 / dMin); }

            const payload = {
                runId: dtActiveRun.runId, potNo: dtActiveRun.potNo, batch: dtBatch, productName: dtProduct,
                minute: minute, phase: phase,
                abvObs: (abvObs === '' ? '' : parseFloat(abvObs)),
                tempSpirit: (tempSpirit === '' ? '' : parseFloat(tempSpirit)),
                abv20: (abv20 === null ? '' : abv20),
                cumVol: (isNaN(cumVol) ? '' : cumVol),
                flowRate: flow,
                vaporTemp: dtNum('dt-vapor-temp'), potTemp: dtNum('dt-pot-temp'), coolTemp: dtNum('dt-cool-temp'),
                note: document.getElementById('dt-note').value
            };
            Swal.fire({ title: 'กำลังบันทึก...', didOpen: () => Swal.showLoading(), allowOutsideClick: false });
            google.script.run
                .withSuccessHandler(function(res) {
                    if (!res || res.success === false) { Swal.fire('Error', (res && res.message) || 'บันทึกไม่สำเร็จ', 'error'); return; }
                    Swal.close();
                    document.getElementById('dt-note').value = '';
                    dtClearLap();   // รีเซ็ตเวลาที่ล็อคหลังบันทึกเสร็จ
                    dtLoadData(); // re-render (อัปเดต maxPhase/flow base จากข้อมูลจริง)
                })
                .withFailureHandler(function(err) { Swal.fire('Error', err.message, 'error'); })
                .saveDistillReading(payload);
        }

        /** ค่าหัวใจที่ "คำนวณ" ของหม้อหนึ่ง (จาก readings ช่วงกลาง รีเซ็ตต่อช่วง) */
        function dtPotHearts(potRows) {
            const hearts = potRows.filter(r => r.phase === 'กลาง').sort((a, b) => (parseFloat(a.minute) || 0) - (parseFloat(b.minute) || 0));
            let prev = 0, vol = 0, ws = 0;
            hearts.forEach(r => { const cum = parseFloat(r.cumVol); if (isNaN(cum)) return; let d = cum - prev; if (d < 0) d = 0; prev = cum; const a = parseFloat(r.abv20); vol += d; if (!isNaN(a)) ws += d * a; });
            return { vol: vol, abv: vol > 0 ? ws / vol : 0 };
        }

        /** รวมค่าจบหม้อทุกหม้อ (ค่าวัดจริง) → สำหรับปิด batch ลง Log_Distill */
        function dtComputeBatchFromFinish(pots) {
            let totalVol = 0, totalWsum = 0, count = 0;
            Object.values(pots).forEach(p => {
                const fin = p.rows.find(r => r.phase === 'จบหม้อ');
                if (!fin) return;
                const v = parseFloat(fin.cumVol), a = parseFloat(fin.abv20);
                if (!isNaN(v) && v > 0) { totalVol += v; if (!isNaN(a)) totalWsum += v * a; count++; }
            });
            return { totalVol: totalVol, totalAbv: totalVol > 0 ? totalWsum / totalVol : 0, count: count };
        }

        /** กด "จบหม้อนี้" → โชว์พาเนลตรวจค่าคำนวณ + กรอกค่าวัดจริง */
        function dtFinishPot() {
            if (!dtActiveRun) return;
            const pots = dtGroupPots();
            const potRows = (pots[dtActiveRun.potNo] && pots[dtActiveRun.potNo].rows) || [];
            const c = dtPotHearts(potRows);
            dtFpComputedAbv = c.abv;
            document.getElementById('dt-fp-pot').innerText = 'หม้อ ' + dtActiveRun.potNo;
            document.getElementById('dt-fp-computed').innerHTML =
                `<i class="fa-solid fa-calculator mr-1 text-gray-400"></i>ค่าคำนวณ (จาก readings) — ปริมาณหัวใจ <b>${c.vol.toFixed(2)}</b> ล. · ดีกรี@20 <b>${c.abv.toFixed(2)}</b>%`;
            document.getElementById('dt-fp-abv20-computed').innerText = c.abv > 0 ? c.abv.toFixed(2) + '%' : '—';
            document.getElementById('dt-fp-vol').value = '';
            document.getElementById('dt-fp-abv').value = '';
            document.getElementById('dt-fp-temp').value = '';
            document.getElementById('dt-fp-abv20').innerText = '—';
            document.getElementById('dt-fp-diff').innerText = '';
            const panel = document.getElementById('dt-finishpot-panel');
            panel.classList.remove('hidden');
            panel.scrollIntoView({ behavior: 'smooth' });
        }

        /** auto ดีกรี@20 จากค่าวัด + เทียบกับค่าคำนวณ */
        function dtFpComputeAbv20() {
            const v = correctAbvTo20C(document.getElementById('dt-fp-abv').value, document.getElementById('dt-fp-temp').value);
            const el = document.getElementById('dt-fp-abv20'), diffEl = document.getElementById('dt-fp-diff');
            if (v === null) { el.innerText = '—'; diffEl.innerText = ''; return; }
            el.innerText = v.toFixed(2) + '%';
            if (dtFpComputedAbv > 0) {
                const d = v - dtFpComputedAbv;
                diffEl.className = 'text-xs ' + (Math.abs(d) <= 1 ? 'text-green-600' : 'text-amber-600');
                diffEl.innerText = '(ต่าง ' + (d >= 0 ? '+' : '') + d.toFixed(2) + ')';
            }
        }

        function dtFinishPotCancel() { document.getElementById('dt-finishpot-panel').classList.add('hidden'); }

        function dtFinishPotConfirm() {
            if (!dtActiveRun) return;
            const volV = document.getElementById('dt-fp-vol').value, abvV = document.getElementById('dt-fp-abv').value, tempV = document.getElementById('dt-fp-temp').value;
            if (volV === '' || abvV === '' || tempV === '') { Swal.fire('กรอกให้ครบ', 'ต้องกรอก ปริมาณกลางรวม / ดีกรีที่วัด / อุณหภูมิ ก่อนจบหม้อ', 'warning'); return; }
            const vol = parseFloat(volV), abv = parseFloat(abvV), temp = parseFloat(tempV);
            if (isNaN(vol) || vol <= 0) { Swal.fire('ปริมาณไม่ถูกต้อง', '', 'warning'); return; }
            const abv20 = correctAbvTo20C(abv, temp);
            const minute = Math.round((Date.now() - dtActiveRun.startTs) / 60000 * 10) / 10;
            const payload = { runId: dtActiveRun.runId, potNo: dtActiveRun.potNo, batch: dtBatch, productName: dtProduct, minute: minute, phase: 'จบหม้อ',
                abvObs: abv, tempSpirit: temp, abv20: (abv20 === null ? '' : abv20), cumVol: vol, flowRate: '', vaporTemp: '', potTemp: '', coolTemp: '', note: '' };
            Swal.fire({ title: 'กำลังปิดหม้อ...', didOpen: () => Swal.showLoading(), allowOutsideClick: false });
            google.script.run
                .withSuccessHandler(function(res) {
                    if (!res || res.success === false) { Swal.fire('Error', (res && res.message) || 'ไม่สำเร็จ', 'error'); return; }
                    Swal.close();
                    document.getElementById('dt-finishpot-panel').classList.add('hidden');
                    dtStopTimer(); dtActiveRun = null;
                    dtLoadData();
                })
                .withFailureHandler(function(err) { Swal.fire('Error', err.message, 'error'); })
                .saveDistillReading(payload);
        }

        function dtOpenFinish() {
            const fin = dtComputeBatchFromFinish(dtGroupPots());
            if (fin.totalVol <= 0) { Swal.fire('ยังไม่มีหม้อที่ปิด', 'ต้องกด "จบหม้อ" อย่างน้อย 1 หม้อก่อน', 'warning'); return; }
            document.getElementById('dt-finish-computed').innerHTML =
                `<i class="fa-solid fa-calculator mr-1 text-gray-400"></i>รวมจากค่าจบหม้อ <b>${fin.count}</b> หม้อ — ปริมาณหัวใจ <b>${fin.totalVol.toFixed(2)}</b> ล. · ดีกรี@20 <b>${fin.totalAbv.toFixed(2)}</b>%`
                + `<br><span class="text-xs text-gray-400">เติมค่าด้านล่างให้แล้ว — แก้ได้ หรือกดยืนยันเลย</span>`;
            document.getElementById('dt-finish-vol').value = fin.totalVol.toFixed(3);
            document.getElementById('dt-finish-abv').value = fin.totalAbv.toFixed(2);
            document.getElementById('dt-finish-date').valueAsDate = new Date();
            dtUpdateLpa();
            const panel = document.getElementById('dt-finish-panel');
            panel.classList.remove('hidden');
            panel.scrollIntoView({ behavior: 'smooth' });
        }

        function dtUpdateLpa() {
            const v = parseFloat(document.getElementById('dt-finish-vol').value), a = parseFloat(document.getElementById('dt-finish-abv').value);
            const el = document.getElementById('dt-finish-lpa');
            el.innerText = (isNaN(v) || isNaN(a)) ? '—' : (v * a / 100).toFixed(3) + ' ลิตร';
        }

        function dtCloseBatch() {
            const date = document.getElementById('dt-finish-date').value;
            const vol = parseFloat(document.getElementById('dt-finish-vol').value);
            const abv = parseFloat(document.getElementById('dt-finish-abv').value);
            if (!date || isNaN(vol) || isNaN(abv)) { Swal.fire('กรอกวันที่/ปริมาณ/ดีกรีให้ครบ', '', 'warning'); return; }
            const batch = dtBatch, product = dtProduct;
            Swal.fire({ title: 'ปิด Batch ' + batch + '?', html: `บันทึกลง Log_Distill:<br><b>${vol.toFixed(2)} ลิตร @ ${abv.toFixed(2)}%</b><br>Batch จะออกจากรายการรอกลั่น`, icon: 'question', showCancelButton: true, confirmButtonText: 'ยืนยันปิด Batch', cancelButtonText: 'ยกเลิก' })
                .then(rc => {
                    if (!rc.isConfirmed) return;
                    Swal.fire({ title: 'กำลังบันทึก...', didOpen: () => Swal.showLoading(), allowOutsideClick: false });
                    google.script.run
                        .withSuccessHandler(function(res) {
                            if (!res || res.success === false) { Swal.fire('Error', (res && res.message) || 'บันทึกไม่สำเร็จ', 'error'); return; }
                            Swal.fire({ icon: 'success', title: 'ปิด Batch สำเร็จ', timer: 1600, showConfirmButton: false });
                            dtStopTimer(); dtActiveRun = null; dtBatch = ''; dtProduct = '';
                            dtResetPanels();
                            document.getElementById('dt-batch').value = '';
                            document.getElementById('dt-product-name').value = '';
                            // refresh pendingBatches ทุก dropdown (batch นี้จะหายไป)
                            google.script.run.withSuccessHandler(populateData).getMasterAndInitialData();
                        })
                        .withFailureHandler(function(err) { Swal.fire('Error', err.message, 'error'); })
                        .saveTransaction('distill', { date: date, productName: product, batch: batch, vol: vol, abv: abv });
                });
        }

        function dtRenderDetail(potNo, pots) {
            const panel = document.getElementById('dt-detail-panel');
            const tabsEl = document.getElementById('dt-pot-tabs');
            if (!potNo || !pots[potNo]) { panel.classList.add('hidden'); if (tabsEl) tabsEl.innerHTML = ''; if (dtChart) { dtChart.destroy(); dtChart = null; } return; }
            panel.classList.remove('hidden');
            document.getElementById('dt-detail-pot').innerText = '— หม้อ ' + potNo;
            // แท็บเลือกหม้อ (ถ้ามีมากกว่า 1 หม้อ)
            const potNos = Object.values(pots).map(p => p.potNo).sort((a, b) => a - b);
            tabsEl.innerHTML = potNos.length > 1
                ? potNos.map(n => `<button type="button" onclick="dtSelectPot(${n})" class="px-3 py-1 rounded text-sm ${n === potNo ? 'bg-orange-600 text-white' : 'bg-gray-200 text-gray-700'}">หม้อ ${n}</button>`).join('')
                : '';
            const reads = pots[potNo].rows.filter(r => DT_PHASES.indexOf(r.phase) >= 0)
                                          .sort((a, b) => (parseFloat(a.minute) || 0) - (parseFloat(b.minute) || 0));
            const tbl = document.getElementById('dt-readings-table');
            if (reads.length === 0) {
                tbl.innerHTML = '<p class="text-center text-gray-400 italic py-3">ยังไม่มีค่าที่บันทึก</p>';
            } else {
                const rows = reads.map(r => `<tr class="border-b border-gray-100">
                    <td class="px-2 py-1.5 text-sm">${fmtNum(r.minute)}</td>
                    <td class="px-2 py-1.5 text-sm">${r.phase}</td>
                    <td class="px-2 py-1.5 text-sm text-right">${fmtNum(r.abvObs)}</td>
                    <td class="px-2 py-1.5 text-sm text-right text-blue-700 font-medium">${fmtNum(r.abv20)}</td>
                    <td class="px-2 py-1.5 text-sm text-right">${fmtNum(r.cumVol)}</td>
                    <td class="px-2 py-1.5 text-sm text-right text-gray-500">${fmtNum(r.flowRate)}</td>
                    <td class="px-2 py-1.5 text-sm text-right">${fmtNum(r.vaporTemp)}</td>
                    <td class="px-2 py-1.5 text-xs text-gray-500">${r.note || ''}</td></tr>`).join('');
                tbl.innerHTML = `<table class="w-full text-left"><thead class="bg-gray-50 border-b text-xs text-gray-500 uppercase"><tr>
                    <th class="px-2 py-1.5">นาที</th><th class="px-2 py-1.5">ช่วง</th><th class="px-2 py-1.5 text-right">ดีกรีอ่าน</th><th class="px-2 py-1.5 text-right">@20°C</th><th class="px-2 py-1.5 text-right">สะสม(ล.)</th><th class="px-2 py-1.5 text-right">ml/min</th><th class="px-2 py-1.5 text-right">ไอ°C</th><th class="px-2 py-1.5">หมายเหตุ</th></tr></thead><tbody>${rows}</tbody></table>`;
            }
            dtRenderChart(reads);
        }

        function fmtNum(v) { if (v === '' || v === null || v === undefined) return '—'; const n = parseFloat(v); return isNaN(n) ? String(v) : ('' + (Math.round(n * 100) / 100)); }

        /** กราฟเส้นโค้งการกลั่น: ดีกรี@20 (ซ้าย) + อุณหภูมิไอ (ขวา) เทียบนาที */
        function dtRenderChart(reads) {
            const canvas = document.getElementById('dt-chart');
            if (!canvas || typeof Chart === 'undefined') return;
            if (dtChart) { dtChart.destroy(); dtChart = null; }
            if (!reads.length) return;
            const labels = reads.map(r => fmtNum(r.minute));
            const num = arr => arr.map(v => (v === '' || v === null || v === undefined) ? null : parseFloat(v));
            dtChart = new Chart(canvas.getContext('2d'), {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        { label: 'ดีกรี@20°C', data: num(reads.map(r => r.abv20)), borderColor: '#2563eb', backgroundColor: '#2563eb', yAxisID: 'yAbv', tension: 0.3 },
                        { label: 'อุณหภูมิไอ (°C)', data: num(reads.map(r => r.vaporTemp)), borderColor: '#dc2626', backgroundColor: '#dc2626', yAxisID: 'yT', tension: 0.3 },
                        { label: 'ปริมาณสะสม (ล.)', data: num(reads.map(r => r.cumVol)), borderColor: '#16a34a', backgroundColor: '#16a34a', yAxisID: 'yVol', tension: 0.3, borderDash: [5, 4] }
                    ]
                },
                options: {
                    responsive: true,
                    interaction: { mode: 'index', intersect: false },
                    scales: {
                        yAbv: { type: 'linear', position: 'left',  title: { display: true, text: '%ABV@20' } },
                        yT:   { type: 'linear', position: 'right', title: { display: true, text: '°C' }, grid: { drawOnChartArea: false } },
                        yVol: { type: 'linear', position: 'right', title: { display: true, text: 'ลิตร' }, grid: { drawOnChartArea: false } }
                    }
                }
            });
        }

        function dtFmtClock(sec) {
            sec = Math.floor(sec);
            const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
            return (h > 0 ? String(h).padStart(2, '0') + ':' : '') + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
        }

        /** กด Lap = ล็อคเวลาตอนอ่านค่า (กดซ้ำ = ปลดล็อค) เวลาที่บันทึกจะใช้ค่านี้ กันเวลาไหลตอนกรอก */
        function dtLap() {
            if (!dtActiveRun) return;
            if (dtLapAtMs == null) {
                dtLapAtMs = Date.now();
                document.getElementById('dt-lap-time').innerText = dtFmtClock((dtLapAtMs - dtActiveRun.startTs) / 1000);
                document.getElementById('dt-lap-display').classList.remove('hidden');
                const b = document.getElementById('dt-lap-btn');
                b.innerText = 'ปลดล็อค'; b.classList.remove('bg-orange-600', 'hover:bg-orange-700'); b.classList.add('bg-slate-600', 'hover:bg-slate-700');
                dtComputeFlow();
            } else {
                dtClearLap();
            }
        }

        function dtClearLap() {
            dtLapAtMs = null;
            const disp = document.getElementById('dt-lap-display'); if (disp) disp.classList.add('hidden');
            const b = document.getElementById('dt-lap-btn');
            if (b) { b.innerText = 'Lap'; b.classList.remove('bg-slate-600', 'hover:bg-slate-700'); b.classList.add('bg-orange-600', 'hover:bg-orange-700'); }
            dtComputeFlow();
        }

        function dtStartTimer() { dtStopTimer(); dtTimerInt = setInterval(dtTick, 1000); dtTick(); }
        function dtStopTimer() { if (dtTimerInt) { clearInterval(dtTimerInt); dtTimerInt = null; } }
        function dtTick() {
            if (!dtActiveRun) { dtStopTimer(); return; }
            const sec = Math.floor((Date.now() - dtActiveRun.startTs) / 1000);
            const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
            document.getElementById('dt-timer').innerText = (h > 0 ? String(h).padStart(2, '0') + ':' : '') + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
        }

        function dtClearReadingInputs() {
            ['dt-abv-obs', 'dt-temp-spirit', 'dt-cum-vol', 'dt-vapor-temp', 'dt-pot-temp', 'dt-cool-temp', 'dt-note'].forEach(id => document.getElementById(id).value = '');
            document.getElementById('dt-abv20-preview').innerText = '—';
            document.getElementById('dt-flow-preview').innerText = '';
        }

        function dtResetPanels() {
            dtStopTimer();
            ['dt-reading-panel', 'dt-detail-panel', 'dt-finish-panel', 'dt-finishpot-panel'].forEach(id => document.getElementById(id).classList.add('hidden'));
            document.getElementById('dt-controls').innerHTML = '';
            document.getElementById('dt-pot-summary').innerHTML = '';
            document.getElementById('dt-pot-tabs').innerHTML = '';
            if (dtChart) { dtChart.destroy(); dtChart = null; }
        }

        // ==========================================
        // ดึงปริมาณน้ำสุราคงเหลือสำหรับหน้าปรุงแต่ง
        // ==========================================
</script>
