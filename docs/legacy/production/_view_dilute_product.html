<!-- ===== view: การปรุงแต่ง + สุราขวด ===== -->
        <!-- 4. การปรุงแต่ง -->
        <div id="tab-dilute" class="tab-content max-w-2xl mx-auto">
            <h2 class="text-2xl font-bold mb-6 text-gray-800 border-b pb-2"><i class="fa-solid fa-flask text-teal-600 mr-2"></i> บันทึกการปรุงแต่ง/ปรับดีกรี</h2>
            <form id="form-dilute" onsubmit="submitForm(event, 'dilute')" class="bg-white p-6 rounded-xl shadow-sm border space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div><label class="block text-sm font-medium text-gray-700">วันที่ปรุงแต่ง</label><input type="date" id="dil-date" required class="mt-1 w-full p-2 border rounded"></div>
                    <div><label class="block text-sm font-medium text-gray-700">เลือกชื่อสุรา</label>
                        <select id="dil-product-name" required class="mt-1 w-full p-2 border rounded prd-name-dropdown" onchange="fetchRemainingVol()"></select>
                    </div>
                </div>
                
                <div class="flex justify-between items-center bg-blue-50 p-3 rounded border border-blue-100">
                    <div class="text-sm text-blue-800"><i class="fa-solid fa-database mr-1"></i> น้ำสุราก่อนปรุงคงเหลือ: <strong id="dil-remaining-vol" class="text-lg">0.00</strong> ลิตร</div>
                    
                    <div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
                        <input type="checkbox" name="toggle" id="calc-toggle" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer" onchange="toggleCalcMode()"/>
                        <label for="calc-toggle" class="toggle-label block overflow-hidden cursor-pointer rounded-full"></label>
                    </div>
                    <span id="calc-status-text" class="text-xs font-bold text-gray-500">ระบบช่วยคำนวณ 2 ทาง (ปิด)</span>
                </div>
                
                <div class="bg-blue-50 p-4 rounded border border-blue-200 space-y-4">
                    <p class="text-sm font-bold text-blue-700">ข้อมูลก่อนปรุง (สุราตั้งต้น)</p>
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="block text-xs text-gray-700">ปริมาณสุราตั้งต้น (ลิตร)</label>
                            <input type="number" step="0.01" id="dil-start-vol" required class="w-full p-2 border rounded calc-input transition-colors" oninput="runCalculator('v1')">
                        </div>
                        <div><label class="block text-xs text-gray-700">ดีกรีตั้งต้น</label>
                            <input type="number" step="0.01" id="dil-start-abv" class="w-full p-2 border rounded calc-input transition-colors" oninput="runCalculator('c1')">
                        </div>
                    </div>
                </div>
                
                <div class="bg-teal-50 p-4 rounded border border-teal-200 space-y-4">
                    <div class="flex justify-between items-center">
                        <p class="text-sm font-bold text-teal-700">ข้อมูลหลังปรุงเสร็จ (พร้อมบรรจุ)</p>
                        <div class="text-xs bg-teal-100 text-teal-800 px-2 py-1 rounded hidden" id="calc-badge"><i class="fa-solid fa-magic"></i> คำนวณอัตโนมัติ 2 ทาง</div>
                    </div>
                    <div class="grid grid-cols-3 gap-2">
                         <div><label class="block text-xs text-gray-700">ดีกรีเป้าหมาย</label>
                            <input type="number" step="0.01" id="dil-final-abv" required class="w-full p-2 border rounded border-teal-300 calc-input transition-colors" oninput="runCalculator('c2')">
                        </div>
                        <div><label class="block text-xs text-gray-700">น้ำที่ต้องเติม (ลิตร)</label>
                            <input type="number" step="0.01" id="dil-water" class="w-full p-2 border rounded transition-colors">
                        </div>
                        <div><label class="block text-xs text-gray-700">ปริมาณสุราหลังปรุง (ลิตร)</label>
                            <input type="number" step="0.01" id="dil-final-vol" required class="w-full p-2 border rounded font-bold text-teal-700 calc-input transition-colors" oninput="runCalculator('v2')">
                        </div>
                    </div>
                    <div><label class="block text-xs text-gray-700">ขนาดขวดที่จะบรรจุ (เพื่อส่งไปหน้ารายงาน)</label>
                        <input type="number" step="0.001" id="dil-bottle-size" placeholder="เช่น 0.33 หรือ 0.625" required class="w-full p-2 border rounded">
                    </div>
                </div>
                <div><label class="block text-sm font-medium text-gray-700">หมายเหตุ</label><input type="text" id="dil-note" class="mt-1 w-full p-2 border rounded"></div>
                <button type="submit" class="w-full bg-teal-600 text-white p-3 rounded font-bold hover:bg-teal-700">บันทึกการปรุงแต่ง</button>
            </form>
        </div>

        <!-- 5. สุราขวด (บรรจุ/ขาย) -->
        <div id="tab-product" class="tab-content max-w-2xl mx-auto">
            <h2 class="text-2xl font-bold mb-6 text-gray-800 border-b pb-2"><i class="fa-solid fa-box-open text-green-600 mr-2"></i> บันทึกรับ-จ่าย สุราขวด</h2>
            <form id="form-product" onsubmit="submitForm(event, 'product')" class="bg-white p-6 rounded-xl shadow-sm border space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div><label class="block text-sm font-medium text-gray-700">วันที่</label><input type="date" id="prd-date" required class="mt-1 w-full p-2 border rounded"></div>
                    <div><label class="block text-sm font-medium text-gray-700">ประเภท</label>
                        <select id="prd-type" class="mt-1 w-full p-2 border rounded">
                            <option value="รับ">รับเข้า (ผลิตได้/บรรจุเสร็จ)</option>
                            <option value="จ่าย">จ่ายออก (จำหน่ายในประเทศ)</option>
                            <option value="จำหน่ายต่างประเทศ">จำหน่ายต่างประเทศ</option>
                            <option value="แตกหักเสียหาย">แตกหักเสียหาย</option>
                            <option value="เสียหาย">เสียหาย</option>
                            <option value="อื่นๆ">อื่น ๆ</option>
                        </select>
                    </div>
                </div>
                <div><label class="block text-sm font-medium text-gray-700">เลือกสุรา (รหัสสินค้า)</label><select id="prd-id" required class="mt-1 w-full p-2 border rounded prd-dropdown"></select></div>
                <div><label class="block text-sm font-medium text-gray-700">จำนวน (ขวด)</label><input type="number" id="prd-amount" required class="mt-1 w-full p-2 border rounded"></div>
                <div><label class="block text-sm font-medium text-gray-700">ลูกค้า / เอกสารอ้างอิง</label><input type="text" id="prd-note" class="mt-1 w-full p-2 border rounded"></div>
                <button type="submit" class="w-full bg-green-600 text-white p-3 rounded font-bold hover:bg-green-700">บันทึกสุราขวด</button>
            </form>
        </div>
