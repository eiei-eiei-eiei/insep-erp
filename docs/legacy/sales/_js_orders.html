<!-- ============================================================
     JS ORDERS — ประวัติ/จัดการออเดอร์ B2B + พิมพ์เอกสาร + boot createApp
     global: ordersMixin · โหลดไฟล์นี้ท้ายสุด (mount ที่นี่)
     ============================================================ -->
<script>
  const ordersMixin = {
    methods: {
      openB2BHistory() {
          // C1-5: default date range = 30 วันล่าสุด (ใช้กับแท็บ "ปิดแล้ว")
          const today  = new Date();
          const d30ago = new Date(); d30ago.setDate(d30ago.getDate() - 30);
          this.historyFilter.dateTo   = today.toISOString().split('T')[0];
          this.historyFilter.dateFrom = d30ago.toISOString().split('T')[0];
          this.orderTab = 'open';           // เปิดมาเริ่มที่แท็บออเดอร์ที่ยังไม่ปิดเสมอ
          this.salesView = 'orders';        // สลับไปหน้าจัดการออเดอร์ (เต็มหน้า)
          // perf: ยิง server เฉพาะตอนยังไม่เคยโหลด (เปิดซ้ำ = เปิดทันทีจาก cache)
          if (!this.b2bOrdersLoaded) this.loadB2BHistory();
      },

      // ปุ่ม Reload — ดึงข้อมูลใหม่จากชีท (เผื่อมีการแก้ใน Google Sheets ตรงๆ)
      // โดยไม่ต้องรีเฟรชหน้า/ล็อกอินใหม่ + ล้าง cache รายการสินค้าด้วย
      reloadB2BHistory() {
          this.b2bItemsCache = {};
          this.loadB2BHistory();
      },

      setHistorySort(key) {
          if (this.historySortKey === key) {
              this.historySortDir = this.historySortDir === 'asc' ? 'desc' : 'asc';
          } else {
              this.historySortKey = key;
              // timestamp default desc (ใหม่สุดก่อน), อื่นๆ asc
              this.historySortDir = key === 'timestamp' ? 'desc' : 'asc';
          }
      },

      resetHistoryFilter() {
          const today  = new Date();
          const d30ago = new Date(); d30ago.setDate(d30ago.getDate() - 30);
          this.historyFilter = {
              search:   '',
              status:   '',
              dateFrom: d30ago.toISOString().split('T')[0],
              dateTo:   today.toISOString().split('T')[0],
          };
          this.historySortKey = 'timestamp';
          this.historySortDir = 'desc';
      },

      loadB2BHistory() {
          this.isB2BHistoryLoading = true;
          if (typeof google === 'undefined') { setTimeout(() => { this.b2bOrders = []; this.b2bOrdersLoaded = true; this.isB2BHistoryLoading = false; }, 800); return; }
          google.script.run
              .withSuccessHandler(data => { this.b2bOrders = data; this.b2bOrdersLoaded = true; this.isB2BHistoryLoading = false; })
              .withFailureHandler(err => { this.isB2BHistoryLoading = false; Swal.fire('Error', err.toString(), 'error'); })
              .getB2BOrdersHistory();
      },

      // โหลดรายการสินค้าของออเดอร์ (cache ต่อ quNo — พิมพ์ซ้ำออเดอร์เดิมไม่ยิง server)
      loadB2BOrderItems(quNo, callback) {
          if (this.b2bItemsCache[quNo]) { callback(this.b2bItemsCache[quNo]); return; }
          if (typeof google === 'undefined') { const mock = [{name: 'สินค้าทดสอบ', qty: 1, price: 1000}]; this.b2bItemsCache[quNo] = mock; callback(mock); return; }
          google.script.run
              .withSuccessHandler(items => { this.b2bItemsCache[quNo] = items; callback(items); })
              .withFailureHandler(err => { this.isB2BHistoryLoading = false; Swal.fire('Error', err.toString(), 'error'); })
              .getB2BOrderItems(quNo);
      },

      // ── งาน A: คิว sync บัญชี (background) ───────────────────
      openAccQueue() {
          this.salesView = 'queue';
          this.loadAccQueue();
          this.startQueueCountdown();
      },
      loadAccQueue() {
          if (typeof google === 'undefined') { this.accQueue = []; this.accQueueLastRunAt = Date.now() - 15000; this.accQueueServerOffset = 0; return; }
          google.script.run.withSuccessHandler(res => {
              this.accQueue             = (res && res.jobs) || [];
              this.accQueueLastRunAt    = res ? res.lastRunAt : null;
              this.accQueueServerOffset = ((res && res.serverNow) || Date.now()) - Date.now();
          }).withFailureHandler(err => { console.error('loadAccQueue:', err); }).getAccSyncQueue();
      },
      // นับถอยหลังถึงรอบ trigger ถัดไป (~lastRun + 60s; ประมาณ เพราะ GAS trigger ไม่เป๊ะวินาที)
      startQueueCountdown() {
          if (this.accQueueTimer) clearInterval(this.accQueueTimer);
          this.accQueueTimer = setInterval(() => {
              if (this.salesView !== 'queue') { clearInterval(this.accQueueTimer); this.accQueueTimer = null; return; }
              if (!this.accQueueLastRunAt) { this.accQueueCountdown = 0; return; }
              const nextRun   = this.accQueueLastRunAt + 60000;
              const nowServer = Date.now() + this.accQueueServerOffset;
              const sec = Math.round((nextRun - nowServer) / 1000);
              if (sec <= 0) {
                  this.accQueueCountdown = 0;
                  // ถึงรอบแล้ว → รอ trigger ยิงเสร็จ (~5 วิ) แล้วรีเฟรชคิว
                  if (!this.accQueueRefreshing) { this.accQueueRefreshing = true; setTimeout(() => { this.loadAccQueue(); this.accQueueRefreshing = false; }, 5000); }
              } else {
                  this.accQueueCountdown = sec;
              }
          }, 1000);
      },
      retryAccQueueJob(job) {
          if (typeof google === 'undefined') return;
          google.script.run.withSuccessHandler(res => {
              this.loadAccQueue();
              if (res && !res.success && res.error) {
                  Swal.mixin({ toast: true, position: 'top-end', showConfirmButton: false, timer: 4000 }).fire({ icon: 'warning', title: 'ยังไม่สำเร็จ: ' + res.error });
              }
          }).withFailureHandler(err => Swal.fire('Error', err.toString(), 'error')).retryAccSyncNow(job.queueId);
      },
      runAccQueueAll() {
          if (typeof google === 'undefined') return;
          Swal.fire({ title: 'กำลังยิงทั้งคิว...', didOpen: () => Swal.showLoading(), allowOutsideClick: false });
          google.script.run.withSuccessHandler(() => { Swal.close(); this.loadAccQueue(); }).withFailureHandler(err => { Swal.close(); Swal.fire('Error', err.toString(), 'error'); }).runAccSyncNow();
      },

      async handleB2BAction(order, action) {
          let title = ''; let html = '';
          const paymentDropdown = `<label class="block text-sm text-left mt-4 mb-1 font-bold text-slate-600">ช่องทางการชำระ:</label><select id="swal-pay-method" class="swal2-input !mt-0" style="display:flex;"><option value="โอนเงิน">โอนเงิน</option><option value="เงินสด">เงินสด</option><option value="บัตรเครดิต">บัตรเครดิต</option><option value="เช็ค">เช็ค</option></select><div id="cheque-details" style="display:none; text-align:left; margin-top:10px; padding:10px; background:#f8fafc; border:1px solid #cbd5e1; border-radius:8px;"><label class="block text-xs font-bold text-slate-700 mb-1">ธนาคาร (Bank):</label><input id="swal-cq-bank" class="swal2-input !mt-0 !mb-2 !text-sm" type="text" placeholder="เช่น กสิกรไทย"><label class="block text-xs font-bold text-slate-700 mb-1">เลขที่เช็ค (Cheque No.):</label><input id="swal-cq-no" class="swal2-input !mt-0 !mb-2 !text-sm" type="text"><label class="block text-xs font-bold text-slate-700 mb-1">ลงวันที่ (Date):</label><input id="swal-cq-date" class="swal2-input !mt-0 !mb-2 !text-sm" type="date"><label class="block text-xs font-bold text-slate-700 mb-1">จำนวนเงิน (Amount):</label><input id="swal-cq-amount" class="swal2-input !mt-0 !text-sm" type="number" step="0.01"></div>`;
          const todayStr = new Date().toLocaleDateString('en-CA'); let askDate = false; let targetAmount = order.netPayable || order.grandTotal; let custCreditTerm = this.b2bCustomers.find(c => c.name === order.customerName)?.creditTerm || 0;

          if (action === 'ISSUE_INVOICE_FULL') { title = '📄 ออกใบแจ้งหนี้จ่ายเต็ม'; askDate = true; html = '<div class="text-center text-slate-700">ต้องการออกใบแจ้งหนี้ราคาสุทธิ <b>฿' + targetAmount.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}) + '</b> <br>เพื่อรอรับชำระเต็มจำนวนใช่หรือไม่?</div>'; } 
          else if (action === 'DEPOSIT_AND_SEND') { title = '💰 รับมัดจำ & ส่งให้คลัง'; askDate = true; let defaultDeposit = this.roundTo2(targetAmount * 0.5); if (order.remarks) { const match = order.remarks.match(/คิดเป็นเงิน[ก-๙a-zA-Z\s]*([0-9,.]+)\s*บาท/); if (match && match[1]) defaultDeposit = this.roundTo2(parseFloat(match[1].replace(/,/g, ''))); } html = '<div class="text-left text-sm mb-2 text-slate-700">ยอดชำระสุทธิทั้งบิล (Net): <b class="text-blue-600 text-lg">฿' + targetAmount.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}) + '</b></div><label class="block text-sm text-left mb-1 font-bold text-slate-600">ยอดเงินมัดจำที่รับชำระ:</label><input id="swal-deposit" class="swal2-input !mt-0" type="number" step="0.01" min="0.01" max="' + targetAmount + '" value="' + defaultDeposit + '">' + paymentDropdown; } 
          else if (action === 'FULL_PAYMENT_AND_SEND') { title = '💳 รับชำระเต็ม & ส่งให้คลัง'; askDate = true; html = '<div class="text-left text-sm mb-4 text-slate-700">ยอดที่ต้องชำระเต็มจำนวน (Net): <b class="text-blue-600 text-xl">฿' + targetAmount.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}) + '</b></div>' + paymentDropdown; } 
          else if (action === 'SEND_TO_WH') { title = '📦 ส่งออเดอร์ให้คลัง (ให้เครดิต)'; askDate = true; html = '<div class="text-center text-slate-700 mt-2">ออเดอร์นี้ลูกค้าเครดิต <b>' + custCreditTerm + ' วัน</b><br>ต้องการส่งให้คลังจัดของเลยใช่หรือไม่?</div>'; } 
          else if (action === 'PAY_BALANCE' || action === 'FULL_PAYMENT_LATER') { title = action === 'PAY_BALANCE' ? '💳 ชำระยอดค้าง' : '💳 ชำระเต็มจำนวน'; askDate = true; html = '<div class="text-left text-sm mb-4 text-slate-700">ยอดที่ต้องชำระ (Net): <b class="text-blue-600 text-xl">฿' + (order.outstandingBalance || 0).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}) + '</b></div>' + paymentDropdown; }

          if (askDate) html += '<label class="block text-sm text-left mt-4 mb-1 font-bold text-slate-600">วันที่ออกเอกสาร / วันที่รับเงิน:</label><input id="swal-doc-date" type="date" class="swal2-input !mt-0" value="' + todayStr + '">';

          const { value: formValues } = await Swal.fire({ title: title, html: html, focusConfirm: false, showCancelButton: true, confirmButtonText: 'บันทึก', cancelButtonText: 'ยกเลิก', didOpen: () => { const m = document.getElementById('swal-pay-method'); if (m) m.addEventListener('change', (e) => { document.getElementById('cheque-details').style.display = e.target.value === 'เช็ค' ? 'block' : 'none'; }); }, preConfirm: () => { 
              let res = {}; 
              const mEl = document.getElementById('swal-pay-method'); 
              if (mEl) { 
                  res.method = mEl.value; 
                  if (res.method === 'เช็ค') { 
                      // จัด Format เช็คใหม่เพื่อบันทึกลง Database ให้สวยๆ
                      const rawBank = document.getElementById('swal-cq-bank').value || '-';
                      let bankDisp = rawBank;
                      if (!bankDisp.includes('ธนาคาร') && bankDisp !== '-') bankDisp = 'ธนาคาร' + bankDisp;
                      const no = document.getElementById('swal-cq-no').value || '-';
                      const d = document.getElementById('swal-cq-date').value || '-';
                      const amt = parseFloat(document.getElementById('swal-cq-amount').value) || 0;
                      const amtDisp = amt.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});

                      res.chequeDetails = `${bankDisp} เลขที่เช็ค : ${no} ลงวันที่ ${d} ยอด ${amtDisp} บาท`;
                  } else res.chequeDetails = ''; 
              } 
              if (action === 'DEPOSIT_AND_SEND') { res.amount = parseFloat(document.getElementById('swal-deposit').value) || 0; res.creditDays = custCreditTerm; } else if (action === 'PAY_BALANCE' || action === 'FULL_PAYMENT_LATER') res.amount = order.outstandingBalance; else if (action === 'SEND_TO_WH') res.creditDays = custCreditTerm; if (askDate) res.docDate = document.getElementById('swal-doc-date').value; return res; 
          } });

          if (formValues) {
              this.isB2BHistoryLoading = true;
              if (typeof google === 'undefined') { setTimeout(() => { this.isB2BHistoryLoading = false; Swal.fire('สำเร็จ', 'บันทึกสถานะเรียบร้อยแล้ว', 'success'); this.salesView = 'create'; }, 500); return; }
              google.script.run.withSuccessHandler(response => {
                  this.isB2BHistoryLoading = false;
                  // perf: patch ออเดอร์เดียวใน-place แทน reload ทั้งก้อน
                  // response.order มาจาก row จริงที่เพิ่งเขียนลงชีท → แม่นยำ
                  // เก็บ cust fields เดิม (address/taxId/branch) ที่ server ไม่ได้ส่งกลับ
                  if (response && response.order) {
                      const idx = this.b2bOrders.findIndex(o => o.quNo === response.order.quNo);
                      if (idx !== -1) this.b2bOrders[idx] = { ...this.b2bOrders[idx], ...response.order };
                  }
                  this.loadAccQueue();   // action ที่มีรับเงินจะ enqueue งานบัญชี → รีเฟรช badge คิว
                  Swal.fire('สำเร็จ', 'อัปเดตสถานะเรียบร้อย', 'success');
                  // แสดง toast เหลืองหลัง success modal — กรณีแอปบัญชี duplicate / API ขัดข้อง
                  if (response && response.apiWarning) {
                      Swal.mixin({ toast: true, position: 'top-end', showConfirmButton: false, timer: 4000, timerProgressBar: true })
                          .fire({ icon: 'warning', title: response.apiWarning });
                  }
              }).withFailureHandler(err => { this.isB2BHistoryLoading = false; Swal.fire('Error', err.toString(), 'error'); }).processB2BOrderAction(order.quNo, action, formValues);
          }
      },

      printFirstDocSet(order) {
          let docsToPrint = [];
          if (order.deposit > 0) {
              docsToPrint = ['invoice', 'tax-invoice-deposit']; 
          } else if (order.status === 'รอชำระเงิน (จ่ายเต็ม)') {
              docsToPrint = ['invoice-only']; 
          } else {
              docsToPrint = ['invoice']; 
          }
          this.printB2BQueue(order, docsToPrint);
      },

      printB2BQueue(order, docTypes) {
          this.isB2BHistoryLoading = true;
          const formatDateTH = (dateStr) => { if (!dateStr) return ''; const d = new Date(dateStr); return isNaN(d.getTime()) ? dateStr : d.toLocaleDateString('th-TH'); };
          const reverseCalc = (netAmt, whtPct) => { let preVat = whtPct > 0 ? netAmt / (1 + 0.07 - (whtPct / 100)) : netAmt / 1.07; return { preVat: this.roundTo2(preVat), vat: this.roundTo2(preVat * 0.07), wht: this.roundTo2(preVat * (whtPct / 100)) }; };
          const docDate1_th = order.docDate1 ? formatDateTH(order.docDate1) : new Date().toLocaleDateString('th-TH');
          const docDate2_th = order.docDate2 ? formatDateTH(order.docDate2) : docDate1_th;

          const proceedToPrint = (fullOrderData) => {
              this.b2bPrintDocs = [];
              docTypes.forEach(docType => {
                  let docOri = JSON.parse(JSON.stringify(fullOrderData)); docOri.docType = docType; docOri.copyType = '(ต้นฉบับ / Original)';
                  let docCopy = JSON.parse(JSON.stringify(fullOrderData)); docCopy.docType = docType; docCopy.copyType = '(สำเนา / Copy)';
                  const setupDoc = (doc) => {
                      doc.documentDate = docDate1_th; 
                      doc.whtPercent = fullOrderData.whtPercent || 0; doc.whtAmount = fullOrderData.whtAmount || 0; doc.netPayable = fullOrderData.netPayable || fullOrderData.grandTotal; doc.subDiscount = this.roundTo2((doc.subTotal || 0) - (fullOrderData.discount || 0));

                      doc.customerBranch = this.formatBranch(fullOrderData.customerBranch);

                      // เช็คว่าเอกสารไหนใช้รายละเอียดเช็คตัวไหน และจัด Format ด้วย this.formatChequeDetail
                      if (docType === 'tax-invoice-deposit') doc.chequeDetails = this.formatChequeDetail(fullOrderData.checkDetail1); 
                      else if (docType === 'tax-invoice-balance' || docType === 'tax-invoice-receipt' || docType === 'tax-invoice-receipt-do') doc.chequeDetails = this.formatChequeDetail(fullOrderData.checkDetail2); 
                      else doc.chequeDetails = '';

                      if (docType === 'invoice') { doc.receiptTitle = 'ใบแจ้งหนี้/ใบส่งสินค้า'; doc.receiptTitleEng = 'Invoice / Delivery Order'; doc.docNo = doc.invNo; doc.outstandingBalance = this.roundTo2(doc.netPayable - (doc.deposit || 0)); if (doc.deposit > 0) { const balVals = reverseCalc(doc.outstandingBalance, doc.whtPercent); doc.receiptPreVat = balVals.preVat; doc.receiptVat = balVals.vat; doc.receiptWht = balVals.wht; const depVals = reverseCalc(doc.deposit, doc.whtPercent); doc.depositPreVat = depVals.preVat; } } 
                      else if (docType === 'invoice-only') { doc.documentDate = docDate1_th; doc.receiptTitle = 'ใบแจ้งหนี้'; doc.receiptTitleEng = 'Invoice'; doc.docNo = doc.invNo; doc.outstandingBalance = this.roundTo2(doc.netPayable - (doc.deposit || 0)); } 
                      else if (docType === 'tax-invoice-deposit') { doc.receiptTitle = 'ใบกำกับภาษี/ใบเสร็จรับเงิน'; doc.receiptTitleEng = 'Tax Invoice / Receipt'; doc.receiptAmount = doc.deposit; doc.docNo = doc.taxNo1; const vals = reverseCalc(doc.receiptAmount, doc.whtPercent); doc.receiptPreVat = vals.preVat; doc.receiptVat = vals.vat; doc.receiptWht = vals.wht; } 
                      else if (docType === 'tax-invoice-balance') { doc.documentDate = docDate2_th; doc.receiptTitle = 'ใบกำกับภาษี/ใบเสร็จรับเงิน'; doc.receiptTitleEng = 'Tax Invoice / Receipt'; doc.receiptAmount = this.roundTo2(doc.netPayable - doc.deposit); doc.docNo = doc.taxNo2; const vals = reverseCalc(doc.receiptAmount, doc.whtPercent); doc.receiptPreVat = vals.preVat; doc.receiptVat = vals.vat; doc.receiptWht = vals.wht; const depVals = reverseCalc(doc.deposit, doc.whtPercent); doc.depositPreVat = depVals.preVat; } 
                      else if (docType === 'tax-invoice-receipt') { doc.documentDate = docDate2_th; doc.receiptTitle = 'ใบกำกับภาษี/ใบเสร็จรับเงิน'; doc.receiptTitleEng = 'Tax Invoice / Receipt'; doc.docNo = doc.taxNo1; }
                      else if (docType === 'tax-invoice-receipt-do') { doc.documentDate = docDate2_th; doc.receiptTitle = 'ใบกำกับภาษี/ใบเสร็จรับเงิน/ใบส่งสินค้า'; doc.receiptTitleEng = 'Tax Invoice / Receipt / Delivery Order'; doc.docNo = doc.taxNo1; }
                  };
                  setupDoc(docOri); setupDoc(docCopy); this.b2bPrintDocs.push(docOri); this.b2bPrintDocs.push(docCopy);
              });
              this.isB2BHistoryLoading = false; this.$nextTick(() => { setTimeout(() => { this.executeIframePrint('b2b-doc'); }, 80); });
          };

          // ใช้ cache รายการสินค้า (พิมพ์ซ้ำออเดอร์เดิมไม่ยิง server)
          this.loadB2BOrderItems(order.quNo, items => proceedToPrint({ ...order, items: items }));
      },

      reprintQuotation(order) {
          this.isB2BHistoryLoading = true;
          const proceedToPrintQuotation = (items) => {
              let estDiscount = this.roundTo2(order.subTotal + order.vatAmount - order.grandTotal); if (Math.abs(estDiscount) < 0.1) estDiscount = 0; 
              const matchedCust = this.b2bCustomers.find(c => c.name === order.customerName) || {}; let docDate = order.timestamp.split(' ')[0] || '';

              this.b2bPrintData = { 
                  quNo: order.quNo, date: docDate, quExp: order.quExp || '-', 
                  customerID: matchedCust.id || '', customerName: order.customerName, customerAddress: order.customerAddress, customerTaxId: order.customerTaxId, 
                  customerBranch: this.formatBranch(order.customerBranch), // นำสาขามาฟอร์แมตก่อนปริ๊น
                  creditTerm: matchedCust.creditTerm || 0, items: items, 
                  subTotal: order.subTotal, discount: estDiscount > 0 ? estDiscount : 0, subDiscount: this.roundTo2(order.subTotal - (estDiscount > 0 ? estDiscount : 0)), vat: order.vatAmount, grandTotal: order.grandTotal, whtPercent: order.whtPercent || 0, whtAmount: order.whtAmount || 0, netPayable: order.netPayable || order.grandTotal, remarks: order.remarks || '-', saleName: this.loggedInUser?.name || '' 
              };
              this.isB2BHistoryLoading = false; this.$nextTick(() => { this.executeIframePrint('a4'); });
          };
          // ใช้ cache รายการสินค้า (พิมพ์ใบเสนอราคาซ้ำไม่ยิง server)
          this.loadB2BOrderItems(order.quNo, items => proceedToPrintQuotation(items));
      },

      executeIframePrint(type) {
          const templateId = type === 'a4' ? 'print-a4-template' : 'print-b2b-doc-template';
          const printHtml = document.getElementById(templateId).innerHTML;
          const iframe = document.createElement('iframe');
          // ให้ iframe มีขนาดจริงชั่วคราวเพื่อวัด content height (วางนอกจอ)
          iframe.style.cssText = 'position:fixed; left:-9999px; top:0; width:794px; height:1500px; border:none; visibility:hidden;';
          document.body.appendChild(iframe);
          const doc = iframe.contentWindow.document; doc.open();
          const baseCss = `@page { size: A4; margin: 10mm; } body { font-family: 'Kanit', sans-serif; -webkit-print-color-adjust: exact; color-adjust: exact; margin: 0; background: white; } .a4-container { width: 100%; max-width: 210mm; margin: 0 auto; box-sizing: border-box; background: white; padding: 0 2mm; }`;
          doc.write(`<!DOCTYPE html><html><head><title>Document</title><style>@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap');${baseCss}</style></head><body>${printHtml.trim()}</body></html>`); doc.close();

          // A4 printable height = 297mm - 20mm (margin top+bottom 10mm×2) = 277mm ≈ 1047px at 96dpi
          // ใช้ 1020px เป็น threshold เผื่อ rounding error เล็กน้อย
          const A4_H = 1020;
          // ต่ำกว่า 75% → content เยอะมาก → ปล่อย paginate ตามธรรมชาติ (ดีกว่าตัวหนังสือเล็กเกิน)
          const MIN_SCALE = 0.75;

          const measureAndPrint = () => {
              // วัด container สูงสุด: รองรับทั้ง single-page (quotation) และ multi-doc (b2b)
              const containers = doc.querySelectorAll('.a4-container');
              let maxH = 0;
              containers.forEach(c => { if (c.offsetHeight > maxH) maxH = c.offsetHeight; });
              if (maxH === 0) maxH = doc.body.scrollHeight;

              const scale = A4_H / maxH;
              if (scale < 1 && scale >= MIN_SCALE) {
                  // Smart scale: ย่อให้พอดีหน้าเดียว (zoom ครอบคลุม print output ด้วย)
                  const styleEl = doc.createElement('style');
                  styleEl.textContent = `body { zoom: ${scale.toFixed(3)}; }`;
                  doc.head.appendChild(styleEl);
              }
              // scale < MIN_SCALE → ไม่ zoom → browser จัด pagination ตามธรรมชาติ (summary ไปหน้า 2)
              // scale >= 1 → content พอดีหรือสั้นกว่า → ไม่ต้องทำอะไร

              iframe.contentWindow.focus();
              iframe.contentWindow.print();
              setTimeout(() => { document.body.removeChild(iframe); }, 120000);
          };

          // รอ font load + render ครบก่อนวัด — พึ่ง doc.fonts.ready เป็นหลัก (รอจริงเท่าที่จำเป็น)
          // setTimeout สั้นๆ แค่ให้ iframe เริ่ม parse DOM ทัน (ลดจาก 600ms → 150ms เพราะ fonts.ready กันงานหนักให้แล้ว)
          setTimeout(() => {
              if (doc.fonts && doc.fonts.ready) {
                  doc.fonts.ready.then(measureAndPrint).catch(measureAndPrint);
              } else {
                  measureAndPrint();
              }
          }, 150);
      }
    }
  };

  createApp({
    mixins: [coreMixin, warehouseMixin, b2bMixin, ordersMixin]
  }).mount('#app');
</script>
